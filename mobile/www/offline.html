<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Offline</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8fafc;color:#0f172a;font-family:system-ui,sans-serif;padding:24px;text-align:center}
    main{max-width:22rem}
    h1{font-size:1.25rem;margin:0 0 .5rem}
    p{color:#475569;line-height:1.5;margin:0 0 1.25rem}
    button{background:#0f766e;color:#fff;border:0;border-radius:.5rem;padding:.75rem 1.25rem;font-size:1rem;font-weight:600}
  </style>
</head>
<body>
  <main>
    <h1>Can&rsquo;t reach the app</h1>
    <p>Parking Research Prototype needs an internet connection. Check your connection and try again.</p>
    <button onclick="history.length > 1 ? history.back() : location.reload()">Try again</button>
  </main>
</body>
</html>
